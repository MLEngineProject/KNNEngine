[build-system]
requires = [
    "scikit-build-core>=1.0.3",
    "pybind11>=3.0.4"
]
build-backend = "scikit_build_core.build"

[project]
name = "knn-engine-core"
version = "0.1.4"
description = "A high-performance C++ KNN Engine with Adaptive PCA"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "numpy",
    "scikit-learn"
]

[project.urls]
Homepage = "https://github.com/AffineFlow/KNNEngine"
Tracker = "https://github.com/AffineFlow/KNNEngine/issues"

[tool.scikit-build]
cmake.version = ">=4.4.0"

[tool.cibuildwheel]
skip = "*-musllinux_* *-win32 *i686 cp*t-win*"